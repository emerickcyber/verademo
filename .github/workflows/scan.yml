name: Veracode Pipeline Scan (PR Gate)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-pipeline-scan:
    name: Build & Scan PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      # 1. Build specifying the pom.xml in the 'app' directory
      - name: Build Application with Maven
        run: mvn clean package -DskipTests -f app/pom.xml

      # 2. Download the official Veracode Pipeline Scan CLI
      - name: Download Veracode Pipeline Scan
        run: |
          curl -sSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip

      # 3. Execute Pipeline Scan with Severity Gate & Optional Baseline
      - name: Run Pipeline Scan
        run: |
          BASELINE_ARG=""
          if [ -f "veracode-baseline.json" ]; then
            echo "Baseline file found. Scanning only for NEW flaws..."
            BASELINE_ARG="--baseline_file veracode-baseline.json"
          fi

          java -jar pipeline-scan.jar \
            --veracode_api_id "${{ secrets.VERACODE_API_ID }}" \
            --veracode_api_key "${{ secrets.VERACODE_API_KEY }}" \
            --file "app/target/verademo.war" \
            --fail_on_severity "Very High, High" \
            --project_name "${{ github.repository }}" \
            --project_ref "${{ github.ref }}" \
            --json_output_file "results.json" \
            $BASELINE_ARG

      # 4. Upload results as a workflow artifact
      - name: Upload Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veracode-pr-findings
          path: results.json